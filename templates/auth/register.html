{% extends 'base.html' %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h4><i class="bi bi-journal-plus me-2"></i>Create account</h4>
    <p class="sub-text">Start your list today</p>
    <form method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" class="form-control"
               placeholder="you@example.com" required autofocus>
      </div>
      <div class="mb-4">
        <label>Password</label>
        <input type="password" name="password" class="form-control"
               placeholder="At least 6 characters" required minlength="6">
      </div>
      <button type="submit" class="btn-notepad">Create Account</button>
    </form>
    <p class="footer-link">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
